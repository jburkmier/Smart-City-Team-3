<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Smart City Application</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1 class="page-title">Smart City</h1>
        <button class="button" id="logout-button" type="button">Logout</button>
    </header>

    <main class="content">
        <h2 class="welcome" id="welcome"></h2>
        <p class="role" id="role"></p>

        <nav class="nav" id="nav" aria-label="Features"></nav>

        <p id="notice" class="message message-info" role="status" hidden></p>
        <p id="error" class="message message-error" role="alert" hidden></p>

        <section id="events-view" class="events-view" aria-labelledby="events-title" hidden>
            <div class="section-heading">
                <h2 id="events-title">Community Events</h2>
                <button class="button" id="close-events" type="button">Back to home</button>
            </div>
            <p id="events-message" class="message" role="status" hidden></p>

            <form id="event-filters" class="event-filters">
                <label>Search
                    <input class="field" name="q" type="search" placeholder="Title or description">
                </label>
                <label>Category
                    <select class="field" name="category">
                        <option value="">All categories</option>
                        <option value="COMMUNITY_SERVICE">Community service</option>
                        <option value="SPORTS">Sports</option>
                        <option value="PUBLIC_SAFETY">Public safety</option>
                        <option value="EDUCATION">Education</option>
                        <option value="ENVIRONMENT">Environment</option>
                        <option value="CULTURAL">Cultural</option>
                    </select>
                </label>
                <label>From
                    <input class="field" name="from" type="date">
                </label>
                <label>To
                    <input class="field" name="to" type="date">
                </label>
                <label>District
                    <select class="field" name="district">
                        <option value="">All districts</option>
                        <option value="DOWNTOWN">Downtown</option>
                        <option value="NORTH">North</option>
                        <option value="SOUTH">South</option>
                        <option value="EAST">East</option>
                        <option value="WEST">West</option>
                    </select>
                </label>
                <label>Price
                    <select class="field" name="free">
                        <option value="">Any price</option>
                        <option value="true">Free</option>
                        <option value="false">Paid</option>
                    </select>
                </label>
                <label>Sort
                    <select class="field" name="sort">
                        <option value="date">Date</option>
                        <option value="popularity">Popularity</option>
                    </select>
                </label>
                <button class="button" type="submit">Apply filters</button>
                <button class="button" id="show-registrations" type="button" hidden>My registrations</button>
                <label id="upcoming-only-label" hidden>
                    <input id="upcoming-only" type="checkbox">
                    Upcoming only
                </label>
            </form>

            <div id="event-list" class="event-list" aria-live="polite"></div>

            <form id="event-form" class="event-form" hidden>
                <h3 id="event-form-title">Create an event</h3>
                <label>Title
                    <input class="field" name="title" maxlength="150" required>
                </label>
                <label>Description
                    <textarea class="field" name="description" maxlength="2000" rows="3"></textarea>
                </label>
                <label>Category
                    <select class="field" name="category" required>
                        <option value="">Choose a category</option>
                        <option value="COMMUNITY_SERVICE">Community service</option>
                        <option value="SPORTS">Sports</option>
                        <option value="PUBLIC_SAFETY">Public safety</option>
                        <option value="EDUCATION">Education</option>
                        <option value="ENVIRONMENT">Environment</option>
                        <option value="CULTURAL">Cultural</option>
                    </select>
                </label>
                <label>Start time
                    <input class="field" name="startTime" type="datetime-local" required>
                </label>
                <label>District
                    <select class="field" name="district" required>
                        <option value="">Choose a district</option>
                        <option value="DOWNTOWN">Downtown</option>
                        <option value="NORTH">North</option>
                        <option value="SOUTH">South</option>
                        <option value="EAST">East</option>
                        <option value="WEST">West</option>
                    </select>
                </label>
                <label>Location details
                    <input class="field" name="locationDetail" maxlength="255">
                </label>
                <label>Price
                    <input class="field" name="price" type="number" min="0" max="999999.99" step="0.01" required>
                </label>
                <div class="links">
                    <button class="button" type="submit">Save event</button>
                    <button class="button" id="cancel-event-edit" type="button">Cancel</button>
                </div>
            </form>
        </section>

        <section id="requests-view" class="requests-view" aria-labelledby="requests-title" hidden>
            <div class="section-heading">
                <h2 id="requests-title">Requests</h2>
                <button class="button" id="close-requests" type="button">Back to home</button>
            </div>
            <p id="request-message" class="message" role="status" hidden></p>
            <form id="request-form" class="request-form" hidden>
                <label>Request type
                    <select class="field" name="type" required>
                        <option value="">Choose a type</option>
                        <option value="STREETLIGHT">Streetlight</option>
                        <option value="POTHOLE">Pothole</option>
                        <option value="GRAFFITI">Graffiti</option>
                        <option value="WATER_LEAK">Water leak</option>
                        <option value="NOISE">Noise</option>
                        <option value="OTHER">Other</option>
                    </select>
                </label>
                <label>Description
                    <textarea class="field" name="description" maxlength="2000" rows="4" required></textarea>
                </label>
                <label>Location
                    <input class="field" name="location" maxlength="255" required>
                </label>
                <div class="links">
                    <button class="button" type="submit">Submit request</button>
                    <button class="button" id="cancel-request" type="button">Cancel</button>
                </div>
            </form>
            <div id="request-list" class="request-list" aria-live="polite"></div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/home.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
