<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Smart City Application</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1 class="page-title">Smart City</h1>
        <button class="button" id="logout-button" type="button">Logout</button>
    </header>

    <main class="content">
        <h2 class="welcome" id="welcome"></h2>
        <p class="role" id="role"></p>

        <nav class="nav" id="nav" aria-label="Features"></nav>

        <p id="notice" class="message message-info" role="status" hidden></p>
        <p id="error" class="message message-error" role="alert" hidden></p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
