// JavaFX desktop client. Talks to the server over HTTP; never touches the database.

plugins {
    id 'application'
    alias(libs.plugins.javafx)
}

javafx {
    version = libs.versions.javafx.get()
    modules = ['javafx.controls']
}

dependencies {
    implementation project(':common')
    implementation libs.jackson.databind
    implementation libs.jackson.jsr310

    testImplementation libs.junit
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(18)
    }
}

application {
    mainClass = 'edu.asu.smartcity.client.ClientApp'
}

// The JavaFX plugin (0.1.0) changes the run task in a way the configuration cache
// can't store, so Gradle skips the cache for this one task instead of failing.
tasks.named('run') {
    notCompatibleWithConfigurationCache('org.openjfx.javafxplugin 0.1.0 configures run at execution time')
}
