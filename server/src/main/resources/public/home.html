<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Smart City Application</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1 class="page-title">Smart City</h1>
        <button class="button" id="logout-button" type="button">Logout</button>
    </header>

    <main class="content">
        <h2 class="welcome" id="welcome"></h2>
        <p class="role" id="role"></p>

        <nav class="nav" id="nav" aria-label="Features"></nav>

        <p id="notice" class="message message-info" role="status" hidden></p>
        <p id="error" class="message message-error" role="alert" hidden></p>

        <section id="reports-view" class="reports-view" aria-labelledby="reports-title" hidden>
            <div class="section-heading">
                <h2 id="reports-title">Reports</h2>
                <button class="button" id="close-reports" type="button">Back to home</button>
            </div>
            <p id="reports-message" class="message message-error" role="alert" hidden></p>
            <form id="department-report-form" class="department-report-form" hidden>
                <label for="department-report-id">Department report</label>
                <select class="field" id="department-report-id" required>
                    <option value="">Choose a department</option>
                </select>
                <button class="button" type="submit">Generate report</button>
            </form>
            <p id="report-generated-at" class="report-generated-at"></p>
            <div id="report-metrics" class="report-metrics" aria-live="polite"></div>
            <div id="report-breakdowns" class="report-breakdowns"></div>
            <button class="button" id="back-to-main-report" type="button" hidden>Back to City Engagement Report</button>
        </section>

        <section id="transit-view" class="transit-view" aria-labelledby="transit-title" hidden>
            <div class="section-heading">
                <h2 id="transit-title">Public Transit Schedule</h2>
                <button class="button" id="close-transit" type="button">Back to home</button>
            </div>
            <p id="transit-message" class="message" role="status" hidden></p>
            <label>Route
                <select class="field" id="transit-route">
                    <option value="">All routes</option>
                </select>
            </label>
            <div class="transit-table-wrapper">
                <table class="transit-table">
                    <thead>
                        <tr><th>Route</th><th>Departs from</th><th>Departs</th><th>Arrives (end of line)</th></tr>
                    </thead>
                    <tbody id="transit-rows" aria-live="polite"></tbody>
                </table>
            </div>
        </section>

        <section id="events-view" class="events-view" aria-labelledby="events-title" hidden>
            <div class="section-heading">
                <h2 id="events-title">Community Events</h2>
                <button class="button" id="close-events" type="button">Back to home</button>
            </div>
            <p id="events-message" class="message" role="status" hidden></p>

            <form id="event-filters" class="event-filters">
                <label>Search
                    <input class="field" name="q" type="search" placeholder="Title or description">
                </label>
                <label>Category
                    <select class="field" name="category">
                        <option value="">All categories</option>
                        <option value="COMMUNITY_SERVICE">Community service</option>
                        <option value="SPORTS">Sports</option>
                        <option value="PUBLIC_SAFETY">Public safety</option>
                        <option value="EDUCATION">Education</option>
                        <option value="ENVIRONMENT">Environment</option>
                        <option value="CULTURAL">Cultural</option>
                    </select>
                </label>
                <label>From
                    <input class="field" name="from" type="date">
                </label>
                <label>To
                    <input class="field" name="to" type="date">
                </label>
                <label>District
                    <select class="field" name="district">
                        <option value="">All districts</option>
                        <option value="DOWNTOWN">Downtown</option>
                        <option value="NORTH">North</option>
                        <option value="SOUTH">South</option>
                        <option value="EAST">East</option>
                        <option value="WEST">West</option>
                    </select>
                </label>
                <label>Price
                    <select class="field" name="free">
                        <option value="">Any price</option>
                        <option value="true">Free</option>
                        <option value="false">Paid</option>
                    </select>
                </label>
                <label>Sort
                    <select class="field" name="sort">
                        <option value="date">Date</option>
                        <option value="popularity">Popularity</option>
                    </select>
                </label>
                <button class="button" type="submit">Apply filters</button>
                <button class="button" id="show-registrations" type="button" hidden>My registrations</button>
                <label id="upcoming-only-label" hidden>
                    <input id="upcoming-only" type="checkbox">
                    Upcoming only
                </label>
            </form>

            <div id="event-list" class="event-list" aria-live="polite"></div>

            <form id="event-form" class="event-form" hidden>
                <h3 id="event-form-title">Create an event</h3>
                <label>Title
                    <input class="field" name="title" maxlength="150" required>
                </label>
                <label>Description
                    <textarea class="field" name="description" maxlength="2000" rows="3"></textarea>
                </label>
                <label>Category
                    <select class="field" name="category" required>
                        <option value="">Choose a category</option>
                        <option value="COMMUNITY_SERVICE">Community service</option>
                        <option value="SPORTS">Sports</option>
                        <option value="PUBLIC_SAFETY">Public safety</option>
                        <option value="EDUCATION">Education</option>
                        <option value="ENVIRONMENT">Environment</option>
                        <option value="CULTURAL">Cultural</option>
                    </select>
                </label>
                <label>Start time
                    <input class="field" name="startTime" type="datetime-local" required>
                </label>
                <label>District
                    <select class="field" name="district" required>
                        <option value="">Choose a district</option>
                        <option value="DOWNTOWN">Downtown</option>
                        <option value="NORTH">North</option>
                        <option value="SOUTH">South</option>
                        <option value="EAST">East</option>
                        <option value="WEST">West</option>
                    </select>
                </label>
                <label>Location details
                    <input class="field" name="locationDetail" maxlength="255">
                </label>
                <label>Price
                    <input class="field" name="price" type="number" min="0" max="999999.99" step="0.01" required>
                </label>
                <div class="links">
                    <button class="button" type="submit">Save event</button>
                    <button class="button" id="cancel-event-edit" type="button">Cancel</button>
                </div>
            </form>
        </section>

        <section id="requests-view" class="requests-view" aria-labelledby="requests-title" hidden>
            <div class="section-heading">
                <h2 id="requests-title">Requests</h2>
                <button class="button" id="close-requests" type="button">Back to home</button>
            </div>
            <p id="request-message" class="message" role="status" hidden></p>
            <form id="request-filters" class="event-filters" hidden>
                <label>Status
                    <select class="field" name="status">
                        <option value="">All statuses</option>
                        <option value="SUBMITTED">Submitted</option>
                        <option value="UNDER_REVIEW">Under review</option>
                        <option value="ASSIGNED">Assigned</option>
                        <option value="IN_PROGRESS">In progress</option>
                        <option value="RESOLVED">Resolved</option>
                        <option value="REJECTED">Rejected</option>
                    </select>
                </label>
                <label>Request type
                    <select class="field" name="type">
                        <option value="">All types</option>
                        <option value="STREETLIGHT">Streetlight</option>
                        <option value="POTHOLE">Pothole</option>
                        <option value="GRAFFITI">Graffiti</option>
                        <option value="WATER_LEAK">Water leak</option>
                        <option value="NOISE">Noise</option>
                        <option value="OTHER">Other</option>
                    </select>
                </label>
                <label>Submitted from
                    <input class="field" name="from" type="date">
                </label>
                <label>Submitted to
                    <input class="field" name="to" type="date">
                </label>
                <label>Sort by date
                    <select class="field" name="sort">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                    </select>
                </label>
                <button class="button" type="submit">Apply filters</button>
                <button class="button" id="reset-request-filters" type="button">Clear filters</button>
            </form>
            <form id="request-form" class="request-form" hidden>
                <label>Request type
                    <select class="field" name="type" required>
                        <option value="">Choose a type</option>
                        <option value="STREETLIGHT">Streetlight</option>
                        <option value="POTHOLE">Pothole</option>
                        <option value="GRAFFITI">Graffiti</option>
                        <option value="WATER_LEAK">Water leak</option>
                        <option value="NOISE">Noise</option>
                        <option value="OTHER">Other</option>
                    </select>
                </label>
                <label>Description
                    <textarea class="field" name="description" maxlength="2000" rows="4" required></textarea>
                </label>
                <label>Location
                    <input class="field" name="location" maxlength="255" required>
                </label>
                <div class="links">
                    <button class="button" type="submit">Submit request</button>
                    <button class="button" id="cancel-request" type="button">Cancel</button>
                </div>
            </form>
            <div id="request-list" class="request-list" aria-live="polite"></div>
        </section>

        <section id="announcements-view" class="announcements-view" aria-labelledby="announcements-title" hidden>
            <div class="section-heading">
                <h2 id="announcements-title">Announcements</h2>
                <button class="button" id="close-announcements" type="button">Back to home</button>
            </div>
            <p id="announcements-message" class="message" role="status" hidden></p>
            <form id="announcement-form" class="announcement-form" hidden>
                <h3>Post an announcement</h3>
                <label>Type
                    <select class="field" name="type" required>
                        <option value="GENERAL">General</option>
                        <option value="EMERGENCY">Emergency</option>
                    </select>
                </label>
                <label>Title
                    <input class="field" name="title" maxlength="150" required>
                </label>
                <label>Message
                    <textarea class="field" name="message" maxlength="2000" rows="4" required></textarea>
                </label>
                <div class="links">
                    <button class="button" type="submit">Post announcement</button>
                </div>
            </form>
            <div id="announcement-list" class="announcement-list" aria-live="polite"></div>
        </section>

        <section id="notifications-view" class="notifications-view" aria-labelledby="notifications-title" hidden>
            <div class="section-heading">
                <h2 id="notifications-title">Notifications</h2>
                <div class="links">
                    <button class="button" id="refresh-notifications" type="button">Refresh</button>
                    <button class="button" id="mark-all-notifications" type="button">Mark all read</button>
                    <button class="button" id="close-notifications" type="button">Back to home</button>
                </div>
            </div>
            <p id="notifications-message" class="message" role="status" hidden></p>
            <div id="notification-list" class="notification-list" aria-live="polite"></div>
        </section>

        <section id="flags-view" class="flags-view" aria-labelledby="flags-title" hidden>
            <div class="section-heading">
                <h2 id="flags-title">Flagged Content</h2>
                <button class="button" id="close-flags" type="button">Back to home</button>
            </div>
            <p id="flags-message" class="message" role="status" hidden></p>
            <label>Show flags
                <select class="field" id="flag-status">
                    <option value="OPEN">Open</option>
                    <option value="DISMISSED">Dismissed</option>
                    <option value="REMOVED">Removed</option>
                </select>
            </label>
            <form id="flags-edit-form" class="flags-edit-form" hidden>
                <h3 id="flags-edit-title">Edit flagged content</h3>
                <div id="flags-edit-fields" class="flags-edit-fields"></div>
                <div class="links">
                    <button class="button" type="submit">Save changes</button>
                    <button class="button" id="cancel-flags-edit" type="button">Cancel</button>
                </div>
            </form>
            <div id="flag-list" class="flag-list" aria-live="polite"></div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/home.js"></script>
    <script src="js/events.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/announcements.js"></script>
    <script src="js/flags.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/transit.js"></script>
</body>
</html>
