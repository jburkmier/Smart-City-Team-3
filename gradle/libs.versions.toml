# Every library version for the project lives here.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
javalin = "6.3.0"
jackson = "2.17.2"
slf4j = "2.0.16"
mysql = "9.1.0"
jbcrypt = "0.4"
junit = "4.13.2"

[libraries]
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
jbcrypt = { module = "org.mindrot:jbcrypt", version.ref = "jbcrypt" }
junit = { module = "junit:junit", version.ref = "junit" }
