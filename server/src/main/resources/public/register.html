<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Smart City Application</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card-page">
        <div class="card">
            <h1 class="card-title">Register</h1>

            <div class="form">
                <label for="email">Email</label>
                <input class="field" id="email" type="email" placeholder="Enter your email">

                <label for="password">Password</label>
                <input class="field" id="password" type="password" placeholder="Enter your password">

                <label for="confirm-password">Confirm Password</label>
                <input class="field" id="confirm-password" type="password" placeholder="Confirm your password">
            </div>

            <!-- Register is not connected to the server yet (T9); for now it goes to the login page. -->
            <a class="button" href="login.html">Register</a>
            <a class="button" href="index.html">Back to Home</a>
        </div>
    </main>

    <script src="js/api.js"></script>
</body>
</html>
