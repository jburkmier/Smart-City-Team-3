<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Smart City Application</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card-page">
        <div class="card">
            <h1 class="card-title">Log in or Register</h1>

            <div class="form">
                <label for="email">Email</label>
                <input class="field" id="email" type="email" placeholder="Enter your email">

                <label for="password">Password</label>
                <input class="field" id="password" type="password" placeholder="Enter your password">
            </div>

            <!-- Login is not connected to the server yet (T9). -->
            <button class="button" id="login-button" type="button">Login</button>
            <a class="button" href="register.html">Register</a>
            <a class="button" href="index.html">Back to Home</a>
        </div>
    </main>

    <script src="js/api.js"></script>
</body>
</html>
